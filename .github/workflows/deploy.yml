name: deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.event.repository.name }}-${{ github.run_id }}
          aws-region: us-east-1
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam build
      - name: sam deploy
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
            DomainName=${{ vars.DOMAIN_NAME }} \
            CertificateArn=${{ vars.CERTIFICATE_ARN }} \
            HostedZoneId=${{ vars.HOSTED_ZONE_ID }} \
            LwaClientId=${{ secrets.LWA_CLIENT_ID }} \
            LwaClientSecret=${{ secrets.LWA_CLIENT_SECRET }} \
            SessionSecret=${{ secrets.SESSION_SECRET }}
