name: deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.event.repository.name }}-${{ github.run_id }}
          aws-region: us-east-1
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Clear rolled-back stack
        run: |
          set +e
          STATUS=$(aws cloudformation describe-stacks --stack-name adafruit-pannel --query "Stacks[0].StackStatus" --output text 2>/dev/null)
          set -e
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STATUS" = "ROLLBACK_FAILED" ] || [ "$STATUS" = "CREATE_FAILED" ]; then
            aws cloudformation delete-stack --stack-name adafruit-pannel
            aws cloudformation wait stack-delete-complete --stack-name adafruit-pannel
            if aws dynamodb describe-table --table-name adafruit-pannel >/dev/null 2>&1; then
              aws dynamodb delete-table --table-name adafruit-pannel
              aws dynamodb wait table-not-exists --table-name adafruit-pannel
            fi
          fi
      - run: sam build
      - name: sam deploy
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --resolve-image-repos \
            --parameter-overrides \
            DomainName=${{ vars.DOMAIN_NAME }} \
            CertificateArn=${{ vars.CERTIFICATE_ARN }} \
            HostedZoneId=${{ vars.HOSTED_ZONE_ID }} \
            LwaClientId=${{ secrets.LWA_CLIENT_ID }} \
            LwaClientSecret=${{ secrets.LWA_CLIENT_SECRET }} \
            SessionSecret=${{ secrets.SESSION_SECRET }}
